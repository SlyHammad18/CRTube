<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181f29"/>
      <stop offset="100%" stop-color="#10151c"/>
    </linearGradient>
  </defs>

  <!-- two antennas, mirrored around rect center x=256 -->
  <g stroke="#4dd8ff" stroke-width="10" stroke-linecap="round">
    <line x1="216" y1="132" x2="182" y2="72"/>
    <line x1="296" y1="132" x2="330" y2="72"/>
  </g>

  <!-- rectangle, center (256, 264) -->
  <rect x="86" y="132" width="340" height="264" rx="36" fill="url(#screenGrad)" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>

  <!-- triangle, centered exactly on rect center -->
  <path d="M 230 226 L 230 302 L 292 264 Z" fill="#4dd8ff"/>

  <!-- 3 lines, smaller, evenly spaced, shared baseline -->
  <g stroke="#4dd8ff" stroke-width="10" stroke-linecap="round">
    <line x1="130" y1="356" x2="130" y2="342"/>
    <line x1="154" y1="356" x2="154" y2="328"/>
    <line x1="178" y1="356" x2="178" y2="338"/>
  </g>

  <!-- yellow dot, right, centered on the bars' vertical mid -->
  <circle cx="382" cy="342" r="10" fill="#ffc24b"/>
</svg>
